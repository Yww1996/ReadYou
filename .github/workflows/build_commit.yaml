name: Build Commit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APK
        run: ./gradlew testGithubReleaseUnitTest assembleGithubRelease --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      - uses: actions/upload-artifact@v4
        with:
          name: Liquid-Reader-${{ github.sha }}
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
